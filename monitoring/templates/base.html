<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Supply Chain Monitor{% endblock %}</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --ink:#e7e9f3; --muted:#9aa0b8;
    --accent:#ff5d5d; --ok:#4ade80; --line:#2a3050; --chip:#232845;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .tag{background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;
    font-size:12px;font-weight:600}
  nav a{color:var(--muted);text-decoration:none;margin-right:14px;font-size:14px}
  nav a:hover,nav a.active{color:var(--ink)}
  main{padding:24px;max-width:1100px;margin:0 auto}
  .banner{background:#2a1430;border:1px solid #5a2140;color:#ffc9d6;
    padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin-bottom:14px}
  .stage{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;
    font-weight:600}
  .stage.build{background:#3a2d12;color:#f6c667}
  .stage.post-install{background:#3a1218;color:#ff8a8a}
  .stage.import{background:#122a3a;color:#7fd4ff}
  .stage.manual,.stage.unknown{background:var(--chip);color:var(--muted)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin-top:10px}
  .kv div.k{color:var(--muted)}
  code{background:#0c0f1c;padding:1px 6px;border-radius:4px;color:#cdd3f0}
  .muted{color:var(--muted)}
  .count{font-size:34px;font-weight:700}
  .pill{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;
    margin:2px;display:inline-block;color:var(--muted)}
  button{background:#242a48;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{background:#2d3458}
  /* timeline */
  .tl{position:relative;margin-left:16px;padding-left:24px;border-left:2px solid var(--line)}
  .tl .node{position:relative;margin-bottom:18px}
  .tl .node::before{content:"";position:absolute;left:-31px;top:4px;width:12px;
    height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .tl .when{color:var(--muted);font-size:13px}
  /* security console */
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .sev{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
  .sev.CRITICAL{background:#3a1218;color:#ff6b6b}
  .sev.HIGH{background:#3a2112;color:#ff9f45}
  .sev.MEDIUM{background:#3a3612;color:#f6d667}
  .sev.LOW{background:#123a2a;color:#79e6b0}
  .sev.UNKNOWN{background:var(--chip);color:var(--muted)}
  .gatebanner{border-radius:10px;padding:16px 20px;font-size:20px;font-weight:700;
    margin-bottom:16px}
  .gatebanner.ok{background:#0f2a1a;border:1px solid #1f5a38;color:#79e6b0}
  .gatebanner.block{background:#2a1216;border:1px solid #5a1f2a;color:#ff6b6b}
  .rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .rule .badge{font-weight:700;min-width:62px}
  .rule.pass .badge{color:var(--ok)}
  .rule.fail .badge{color:var(--accent)}
  .counts span{margin-right:12px}
  .chipbtn{background:var(--chip);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;margin-right:6px}
  .chipbtn:hover{color:var(--ink)}
  .chipbtn.active{background:#2d3458;color:var(--ink);border-color:#3a4170}
</style>
</head>
<body>
<header>
  <h1>Supply Chain Monitor <span class="tag">LAB · localhost</span></h1>
  <nav>
    <a href="/" class="{{ 'active' if active=='dash' else '' }}">Attack monitor</a>
    <a href="/timeline" class="{{ 'active' if active=='tl' else '' }}">Timeline</a>
    <a href="/security" class="{{ 'active' if active=='sec' else '' }}">Security console</a>
    <a href="/api/events">JSON</a>
  </nav>
</header>
<main>
  <div class="banner">
    Educational lab. All data below is benign, non-sensitive host metadata sent
    to this machine over loopback by the demo package. Nothing left your computer.
  </div>
  {% block body %}{% endblock %}
</main>
</body>
</html>
